# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.real }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        compiler: [default]
        real: [double]
        include:
          # Precision matters here: the same algorithm at float precision loses
          # ~9 digits, so it gets its own job rather than being assumed to work.
          - os: ubuntu-latest
            compiler: gcc
            real: float
          - os: ubuntu-latest
            compiler: clang
            real: double

    steps:
      - uses: actions/checkout@v4

      - name: Select compiler
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang"   >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          elif [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc"   >> "$GITHUB_ENV"
            echo "CXX=g++"  >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DPHANTOM_WERROR=ON
          -DPHANTOM_REAL_FLOAT=${{ matrix.real == 'float' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Benchmark (informational)
        if: matrix.real == 'double'
        run: |
          if [ -f build/phantom_bench ]; then
            ./build/phantom_bench
          elif [ -f build/Release/phantom_bench.exe ]; then
            ./build/Release/phantom_bench.exe
          fi
        shell: bash

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DPHANTOM_SANITIZE=ON
          -DPHANTOM_WERROR=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: ./build/phantom_tests

  no-allocation:
    name: Zero-allocation audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source audit
        run: python3 tools/audit_no_alloc.py

      - name: Link audit
        # The definitive check: nothing in the library object code may reference
        # an allocation symbol. Greps can be fooled by clever code; nm cannot.
        run: |
          set -e
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DPHANTOM_BUILD_TESTS=OFF -DPHANTOM_BUILD_EXAMPLES=OFF \
                -DPHANTOM_BUILD_BENCH=OFF
          cmake --build build --parallel
          echo "--- undefined symbols referenced by libphantom-sonar.a ---"
          nm -uC build/libphantom-sonar.a || true
          if nm -uC build/libphantom-sonar.a \
               | grep -E 'operator new|operator delete|\bmalloc\b|\bcalloc\b|\brealloc\b|\bfree\b'; then
            echo "::error::library object code references an allocator"
            exit 1
          fi
          echo "clean: no allocator symbols referenced"

  generated-data:
    name: Generated test data is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: UNESCO table reproduces the published equation, and its header
        # The table is transcribed by hand from a SCANNED 1983 document with no
        # text layer, so the transcription needs verifying. The generator
        # evaluates the separately-entered published coefficients against every
        # transcribed value and fails on any outlier -- which is what a slipped
        # digit looks like. Then it regenerates the header, and the diff proves
        # nobody has hand-edited a value into the committed copy.
        run: |
          set -e
          python3 tools/make_unesco_table.py /tmp/unesco.hpp
          diff -u tests/data/unesco44_table.hpp /tmp/unesco.hpp

      - name: Profile header matches the shipped CSVs
        run: |
          set -e
          python3 tools/make_profile_header.py data/profiles /tmp/profiles.hpp
          diff -u tests/data/woa_profiles.hpp /tmp/profiles.hpp

  c-abi-and-portability:
    name: C ABI, cross-compilation and size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-arm-linux-gnueabihf g++-riscv64-linux-gnu

      - name: C ABI compiled by a C compiler
        # Not by C++ in C mode. A header that only ever meets a C++ compiler
        # accumulates C++-isms and nobody finds out until a real C caller does.
        run: |
          set -e
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPHANTOM_WERROR=ON
          cmake --build build --parallel
          ./build/phantom_c_tests

      - name: No exceptions, no RTTI
        # Should be a no-op -- nothing throws -- which is why a link error here
        # is worth having rather than an unwinder in a firmware image.
        run: |
          set -e
          cmake -S . -B build-nx -DCMAKE_BUILD_TYPE=Release \
                -DPHANTOM_NO_EXCEPTIONS=ON -DPHANTOM_WERROR=ON \
                -DPHANTOM_BUILD_TESTS=OFF -DPHANTOM_BUILD_EXAMPLES=OFF \
                -DPHANTOM_BUILD_BENCH=OFF
          cmake --build build-nx --parallel
          echo "--- unwinder symbols referenced ---"
          if nm -uC build-nx/libphantom-sonar.a | grep -E '__cxa_throw|_Unwind_|__gxx_personality'; then
            echo "::error::exception machinery reached a -fno-exceptions build"
            exit 1
          fi
          echo "clean"

      - name: Cross-compile (ARM 32-bit float, RISC-V 64-bit double)
        # Two architectures AND two word sizes AND both precisions, because the
        # bugs this catches are the ones that only appear when size_t, pointer
        # width or Real change together.
        run: |
          set -e
          for cfg in "armhf arm-linux-gnueabihf ON" "riscv64 riscv64-linux-gnu OFF"; do
            set -- $cfg
            cmake -S . -B build-$1 -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Linux \
                  -DCMAKE_CXX_COMPILER=$2-g++ -DCMAKE_C_COMPILER=$2-gcc \
                  -DPHANTOM_REAL_FLOAT=$3 -DPHANTOM_NO_EXCEPTIONS=ON -DPHANTOM_WERROR=ON \
                  -DPHANTOM_BUILD_TESTS=OFF -DPHANTOM_BUILD_EXAMPLES=OFF -DPHANTOM_BUILD_BENCH=OFF
            cmake --build build-$1 --parallel
            echo "--- $1 size report ---"
            $2-size -t build-$1/CMakeFiles/phantom_sonar.dir/src/*.o | tail -1
            if $2-nm -uC build-$1/libphantom-sonar.a | grep -E 'operator new|\bmalloc\b'; then
              echo "::error::$1 build references an allocator"
              exit 1
            fi
          done

      - name: No static storage in the library
        # 160 kB of .bss once hid in the C ABI's ray-trace scratch buffer, which
        # is half the RAM of the part this is meant to fit on. Nothing in the
        # library may carry mutable static state: it costs RAM and it costs
        # reentrancy.
        run: |
          set -e
          echo "--- .bss and .data across the library ---"
          size -t build-armhf/CMakeFiles/phantom_sonar.dir/src/*.o | tail -1 || \
            arm-linux-gnueabihf-size -t build-armhf/CMakeFiles/phantom_sonar.dir/src/*.o | tail -1
          bss=$(arm-linux-gnueabihf-size -t build-armhf/CMakeFiles/phantom_sonar.dir/src/*.o | tail -1 | awk '{print $3}')
          data=$(arm-linux-gnueabihf-size -t build-armhf/CMakeFiles/phantom_sonar.dir/src/*.o | tail -1 | awk '{print $2}')
          echo "bss=$bss data=$data"
          if [ "$bss" -ne 0 ] || [ "$data" -ne 0 ]; then
            echo "::error::the library gained mutable static storage"
            exit 1
          fi

  rust-bindings:
    name: Rust bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the C library
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Test the bindings
        working-directory: bindings/rust
        env:
          PHANTOM_SONAR_LIB_DIR: ${{ github.workspace }}/build
        run: |
          cargo fmt --check || true
          cargo clippy --all-targets -- -D warnings || true
          cargo test

  static-analysis:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: >
          cppcheck --enable=warning,style,performance,portability
          --std=c++20 --error-exitcode=1 --inline-suppr --quiet
          --suppress=missingIncludeSystem
          -I include/ src/

  bellhop-cross-validation:
    name: Cross-validation vs Bellhop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran

      # The toolbox build is serial by necessity (undeclared Fortran .mod
      # dependencies) and takes several minutes, so it is cached on the
      # setup script's hash -- the pinned AT version lives in there.
      - name: Cache Acoustics Toolbox
        id: cache-at
        uses: actions/cache@v4
        with:
          path: build/acoustics-toolbox
          key: at-${{ runner.os }}-${{ hashFiles('tools/bellhop_compare/setup_bellhop.sh') }}

      - name: Build Bellhop
        if: steps.cache-at.outputs.cache-hit != 'true'
        run: ./tools/bellhop_compare/setup_bellhop.sh

      - name: Build libphantom-sonar
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPHANTOM_WERROR=ON
          cmake --build build --parallel

      - name: Install Python dependencies
        run: python3 -m pip install --quiet numpy matplotlib

      # --check asserts the turning-depth agreement, which is the metric that
      # needs no interpolation and so actually compares the two tracers.
      - name: Compare
        run: |
          python3 tools/bellhop_compare/compare.py \
                  --bellhop build/acoustics-toolbox/at/Bellhop/bellhop.exe \
                  --check --json build/bellhop_summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: bellhop-comparison
          path: |
            data/bellhop_comparison.png
            build/bellhop_summary.json

  example-runs:
    name: Example produces the expected channel analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Run and check the SOFAR numbers
        run: |
          mkdir -p out
          ./build/munk_simulation out | tee report.txt
          # The Munk axis is at 1300 m with a +/- 14.38 deg trapping cone.
          # If either moves, something in the physics changed.
          grep -q "axis depth         : 1300.0 m" report.txt
          grep -q "trapping cone      : +/- 14.38" report.txt
          test -s out/rays.csv
          test -s out/coverage.csv
      - name: Run the ping intercept example
        run: |
          ./build/ping_intercept out | tee intercept.txt
          # 5 pings present; a regression in the detector shows up here first.
          grep -q "correctly detected   : 5" intercept.txt

      - name: Run the countermeasure loop
        run: |
          ./build/countermeasure_loop | tee loop.txt
          # The two halves must keep agreeing: a Doppler bin error of +4.0 m/s
          # has to produce exactly the arrival bias the coupling formula gives.
          grep -q "error +0.0885" loop.txt
          grep -q "dt = -(v/c) f_end/mu = +0.0885 ms" loop.txt
          grep -q "ghosts resolved    : 3" loop.txt
          # The ray tracer must still be supplying the multipath structure.
          grep -q "Multipath from the ray tracer" loop.txt
          grep -qE "-> [0-9]+ echoes spanning" loop.txt
          # Boundary losses must be in the picture: a bounced path has to cost
          # more than the direct one, or v0.5 has silently regressed.
          grep -q "critical grazing angle" loop.txt
          # Reverberation must still show the SL/TL cancellation argument.
          grep -q "echo-to-reverberation ratio" loop.txt
          grep -q "a louder transmitter buys nothing" loop.txt
          # The array section must still report a sub-beamwidth bearing bound.
          grep -q "If this vehicle carried an array" loop.txt
          grep -q "bearing is bounded at" loop.txt

      - uses: actions/upload-artifact@v4
        with:
          name: simulation-output
          path: out/
