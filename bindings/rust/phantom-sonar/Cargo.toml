[package]
name = "phantom-sonar"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Safe Rust bindings for libphantom-sonar: ocean acoustics, ray tracing, tracking"

[lib]
name = "phantom_sonar"
path = "src/lib.rs"

[dependencies]
phantom-sonar-sys = { path = "../phantom-sonar-sys", version = "1.0.0" }

[features]
real_float = ["phantom-sonar-sys/real_float"]
